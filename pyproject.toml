[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "pv-signal-lab"
version = "0.1.0"
description = "Signal detection, imputation and a label assistant for spontaneous adverse-event reports, tested on synthetic data with known ground truth."
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["numpy>=1.26", "pandas>=2.1", "scipy>=1.11", "scikit-learn>=1.4"]

[project.optional-dependencies]
plots = ["matplotlib>=3.8"]
test = ["pytest>=8"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
